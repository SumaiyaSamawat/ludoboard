
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Ludo Board</h2>

    <div class="ludo-board">

        <!-- Red home -->
        <div class="home red">
            <div class="yard">
                <span></span><span></span>
                <span></span><span></span>
            </div>
        </div>

        <!-- Top path -->
        <div class="path top-path">
            <div></div><div class="green"></div><div></div>
            <div></div><div class="green"></div><div></div>
            <div></div><div class="green"></div><div></div>
        </div>

        <!-- Green home -->
        <div class="home green-home">
            <div class="yard">
                <span></span><span></span>
                <span></span><span></span>
            </div>
        </div>

        <!-- Left path -->
        <div class="path left-path">
            <div></div><div></div><div></div>
            <div class="red"></div><div class="red"></div><div class="red"></div>
            <div></div><div></div><div></div>
        </div>

        <!-- Center -->
        <div class="center">
            <div class="triangle red-triangle"></div>
            <div class="triangle green-triangle"></div>
            <div class="triangle yellow-triangle"></div>
            <div class="triangle blue-triangle"></div>
        </div>

        <!-- Right path -->
        <div class="path right-path">
            <div></div><div class="yellow"></div><div></div>
            <div></div><div class="yellow"></div><div></div>
            <div></div><div class="yellow"></div><div></div>
        </div>

        <!-- Blue home -->
        <div class="home blue-home">
            <div class="yard">
                <span></span><span></span>
                <span></span><span></span>
            </div>
        </div>

        <!-- Bottom path -->
        <div class="path bottom-path">
            <div></div><div></div><div></div>
            <div class="blue"></div><div class="blue"></div><div class="blue"></div>
            <div></div><div></div><div></div>
        </div>

        <!-- Yellow home -->
        <div class="home yellow-home">
            <div class="yard">
                <span></span><span></span>
                <span></span><span></span>
            </div>
        </div>

    </div>

</body>
</html>
